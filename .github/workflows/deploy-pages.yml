name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (Hub + openGym)
        run: |
          npm ci
          npm --prefix opengym/frontend ci

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build openGym + Personal OS for GitHub Pages
        run: |
          VITE_DEMO=1 npm --prefix opengym/frontend run build -- --outDir ../../public/opengym --emptyOutDir
          git clone --depth=1 --filter=blob:none --sparse https://github.com/DuarteSantos8/openGym.git /tmp/opengym-media
          git -C /tmp/opengym-media sparse-checkout set catalogue/media scripts/catalogue
          node /tmp/opengym-media/scripts/catalogue/stage-media.mjs public/opengym
          rm -rf /tmp/opengym-media
          BASE_PATH="${{ steps.pages.outputs.base_path }}"
          if [ -z "$BASE_PATH" ]; then
            BASE_PATH="/"
          else
            BASE_PATH="${BASE_PATH%/}/"
          fi
          npx tsc && npx vite build --base "$BASE_PATH"
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
